version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      crates:
        patterns: ["*"]
    ignore:
      # Pinned to match the installed Tracy profiler; bump them alongside it
      - dependency-name: tracy-client
      - dependency-name: tracy-client-sys
      # Must match the glam version asset-importer uses, so it moves with that
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    # Generated by dist, which won't release if it's edited. Its actions are
    # set in dist-workspace.toml instead.
    exclude-paths:
      - .github/workflows/release.yml
