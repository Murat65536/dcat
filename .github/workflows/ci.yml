name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # asset-importer downloads Assimp next to its sources by default, which the
  # cache doesn't keep, so cached builds would fail to link
  ASSET_IMPORTER_CACHE_DIR: ${{ github.workspace }}/.asset-importer

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ env.ASSET_IMPORTER_CACHE_DIR }}
      - name: Install zlib
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with Tracy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features tracy -- -D warnings
      - run: cargo test
