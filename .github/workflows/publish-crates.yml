# Publishes the crate to crates.io during a release. dist's release workflow
# calls this once every platform has built (publish-jobs in dist-workspace.toml).
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
