[package]
name = "dcat"
version = "1.3.0"
edition = "2024"
description = "A 3D model viewer for the terminal"
license = "Apache-2.0"
repository = "https://github.com/Murat65536/dcat"
readme = "README.md"
keywords = ["3d", "terminal", "viewer", "model", "cli"]
categories = ["command-line-utilities", "graphics", "rendering"]
# Test models are only needed in the repository
exclude = ["tests/"]

[dependencies]
asset-importer = { version = "0.8.0", features = ["bytemuck", "glam", "prebuilt", "static-link"] }
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
glam = { version = "0.32.1", features = ["bytemuck"] }
image = "0.25.10"
pollster = "1.0.1"
profiling = "1.0.18"
signal-hook = "0.3.18"
spin_sleep = "1.3.3"
tracy-client = { version = "=0.18.4", default-features = false, optional = true }
# tracy-client 0.18.4 and tracy-client-sys 0.28.0 bundle Tracy 0.13.1, matching
# the 0.13 viewer. Newer releases use the incompatible Tracy 0.14 protocol.
tracy-client-sys = { version = "=0.28.0", default-features = false, optional = true }
typed-path = "0.13.0"
wgpu = "30.0.0"

[features]
# Tracy profiling: collects only while a viewer on this machine is connected
tracy = [
    "profiling/profile-with-tracy",
    "dep:tracy-client",
    "dep:tracy-client-sys",
    "tracy-client/enable",
    "tracy-client/ondemand",
    "tracy-client/only-localhost",
]

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
vt100 = "0.18.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
