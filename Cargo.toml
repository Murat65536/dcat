[package]
name = "dcat"
version = "1.3.0"
edition = "2024"

[dependencies]
asset-importer = { version = "0.8.0", features = ["bytemuck", "glam", "prebuilt", "static-link"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
glam = "0.32.1"
image = "0.25.10"
pollster = "1.0.1"
wgpu = "30.0.0"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
