[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Extra steps before each build, relative to .github/workflows
github-build-setup = "../build-setup.yml"
# Publish jobs to run in CI
publish-jobs = ["./publish-crates"]

# Latest runner images, so image changes surface problems early. Linux stays
# on Ubuntu 22.04: the binary needs the glibc of the system that builds it.
# There's no free floating Intel macOS image, so that one is pinned.
[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-apple-darwin = "macos-latest"
x86_64-apple-darwin = "macos-26-intel"
x86_64-pc-windows-msvc = "windows-latest"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

# Newer action versions than this dist release generates
[dist.github-action-commits]
"actions/checkout" = "v7"
"actions/upload-artifact" = "v7"
"actions/download-artifact" = "v8"

# Statically linked Assimp needs zlib at link time, and building it from
# source needs CMake
[dist.dependencies.apt]
zlib1g-dev = "*"
cmake = "*"
